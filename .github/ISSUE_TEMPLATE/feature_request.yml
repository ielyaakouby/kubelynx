name: Feature request
description: Suggest an enhancement to KubeLynx
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: What should KubeLynx do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, kubectl workflows, or existing menu paths.
  - type: textarea
    id: kubernetes
    attributes:
      label: Kubernetes context
      description: Cluster type or resource kinds involved, if relevant. Do not include credentials or kubeconfig.
