name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: syntax-lint-format-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zip
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version
          shellcheck --version | head -n 1

      - name: make check
        run: make check

      - name: CLI smoke tests
        run: |
          ./bin/kubelynx.sh --version
          ./bin/kubelynx.sh --help
